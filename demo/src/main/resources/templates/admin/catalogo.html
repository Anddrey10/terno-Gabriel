<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Catálogo | Terno Gabriel</title>
    <link rel="icon" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin/catalogo.css}">
<link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>

<body class="page-admin-catalogo">
    <div class="app-shell">
        <aside th:replace="~{fragments/sidebar-admin :: sidebar('catalogo')}"></aside>
        <main class="main">
            <header th:replace="~{fragments/mobile-header :: mobile-header}"></header>
            <div class="page-header">
                <div><span class="frame-label">E-09</span>
                    <h1>Catálogo</h1>
                    <p>Colección completa Terno Gabriel</p>
                </div>
                <div class="header-actions"><button class="icon-btn notification" data-action="notify" aria-label="Notificaciones" title="Notificaciones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><i></i></button>
                    <div class="date-block"><span>Hoy</span><strong data-current-date>-- --- ----</strong></div>
                </div>
            </div>
            <div class="content">
                <div class="catalog-toolbar">
                    <input class="searchbox" data-product-search placeholder="Buscar en el catálogo">
                    <label class="sold-filter-toggle"><input type="checkbox" id="soloVendidosAdmin"> Mostrar solo vendidos</label>
                </div>

                <!-- FILTROS AVANZADOS: aquí están todos los filtros del catálogo -->
                <div class="advanced-filters-container">
                    <div class="filters-header-row">
                        <span class="filters-title">Filtros avanzados</span>
                        <button class="btn-reset-filters" id="resetFiltersBtn" type="button">Restablecer filtros</button>
                    </div>
                    <div class="filter-tabs-row">
                        <div class="filter-group">
                            <label>PRENDA</label>
                            <div class="category-scroll">
                                <button class="active" type="button" data-category="Todos">Todos</button>
                                <button type="button" data-category="Ternos">Ternos</button>
                                <button type="button" data-category="Smoking">Smoking</button>
                                <button type="button" data-category="Accesorios">Accesorios</button>
                            </div>
                        </div>
                        <div class="filter-group">
                            <label>ESTADO DE LA PRENDA</label>
                            <div class="category-scroll">
                                <button class="active" type="button" data-tipo-tab="">Todos</button>
                                <button type="button" data-tipo-tab="Nuevo">Nuevo</button>
                                <button type="button" data-tipo-tab="Seminuevo">Seminuevo</button>
                            </div>
                        </div>
                    </div>
                    <div class="filters-row">
                        <div class="filter-group">
                            <label>COLOR</label>
                            <select class="filter-select" data-filter="color"></select>
                        </div>
                        <div class="filter-group">
                            <label>CATEGORÍA</label>
                            <select class="filter-select" data-filter="categoria"></select>
                        </div>
                        <div class="filter-group">
                            <label>ESTILO</label>
                            <select class="filter-select" data-filter="estilo"></select>
                        </div>
                        <div class="filter-group">
                            <label>TALLA</label>
                            <select class="filter-select" data-filter="talla"></select>
                        </div>
                    </div>
                    <div class="components-section">
                        <span class="components-label">Componentes individuales (Selección múltiple):</span>
                        <div class="checkbox-chips">
                            <label class="chip-checkbox"><input type="checkbox" name="componente" value="Saco"> Saco</label>
                            <label class="chip-checkbox"><input type="checkbox" name="componente" value="Pantalón"> Pantalón</label>
                            <label class="chip-checkbox"><input type="checkbox" name="componente" value="Chaleco"> Chaleco</label>
                            <label class="chip-checkbox"><input type="checkbox" name="componente" value="Corbata / Michi"> Corbata / Michi</label>
                            <label class="chip-checkbox"><input type="checkbox" name="componente" value="Camisa"> Camisa</label>
                        </div>
                    </div>
                </div>
                <!-- FIN DE FILTROS -->

                <div class="product-grid"></div>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/toast :: toast('Cambios guardados')}"></div>
    <script th:src="@{/js/api.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/admin/catalogo.js}" defer></script>
</body>

</html>
