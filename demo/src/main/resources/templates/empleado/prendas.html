<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Estado de Prendas | Terno Gabriel</title>
    <link rel="icon" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/empleado/prendas.css}">
<link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>

<body class="page-empleado-prendas">
    <div class="app-shell">
        <aside th:replace="~{fragments/sidebar-empleado :: sidebar('prendas')}"></aside>

        <main class="main">
            <header th:replace="~{fragments/mobile-header :: mobile-header}"></header>

            <div class="page-header">
                <div>
                    <span class="frame-label">E-08</span>
                    <h1>Estado de Prendas</h1>
                    <p>Disponibilidad y ubicación del inventario</p>
                </div>
                <div class="header-actions">
                    <button class="icon-btn notification" data-action="notify" aria-label="Notificaciones" title="Notificaciones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><i></i></button>
                    <div class="date-block"><span>Hoy</span><strong data-current-date>-- --- ----</strong></div>
                </div>
            </div>

            <div class="content">
                <section class="card inventory-card">
                    <div class="card-head">
                        <div class="head-title">
                            <h2>Inventario de prendas</h2>
                            <p class="subtitle-stats">0 prendas registradas · 0 disponibles</p>
                        </div>
                        <div class="filter-row">
                            <div class="search-box-wrapper">
                                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input class="searchbox" data-table-search placeholder="Código o nombre">
                            </div>
                            <select class="select-filter" data-state-filter>
                                <option value="Todos">Todos los estados</option>
                                <option value="Disponible">Disponible</option>
                                <option value="Alquilado">Alquilado</option>
                                <option value="En lavandería">Lavandería</option>
                                <option value="En restauración">Restauración</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th class="col-codigo">CÓDIGO</th>
                                    <th class="col-nombre">NOMBRE</th>
                                    <th class="col-talla">TALLA</th>
                                    <th class="col-costo">COSTO DE ALQUILER</th>
                                    <th class="col-precio">PRECIO DE VENTA</th>
                                    <th class="col-estado">ESTADO</th>
                                    <th class="col-responsable">CLIENTE / ORDEN</th>
                                    <th class="col-accion">ACCIÓN</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/toast :: toast('Cambios guardados')}"></div>
    <script th:src="@{/js/api.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/empleado/prendas.js}" defer></script>
</body>

</html>
